name: Release Packages & Extension Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.VITE_GITHUB_OAUTH_CLIENT_ID || secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and test
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Package Chrome & Firefox extension zips
        run: |
          pnpm --filter @glyphrig/extension zip
          pnpm --filter @glyphrig/extension zip:firefox

      - name: Upload extension build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-bundles
          path: |
            apps/extension/.output/*.zip
            apps/extension/.output/firefox-mv3/
          include-hidden-files: true
          if-no-files-found: error

  publish-npm:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies & build packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @glyphrig/core build
          pnpm --filter @glyphrig/site build
          pnpm --filter @glyphrig/cli build

      - name: Publish @glyphrig packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add NPM_TOKEN in GitHub repository Secrets -> Actions."
            exit 1
          fi
          pnpm --filter @glyphrig/core publish --no-git-checks --access public --provenance
          pnpm --filter @glyphrig/site publish --no-git-checks --access public --provenance
          pnpm --filter @glyphrig/cli publish --no-git-checks --access public --provenance

  publish-github:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: extension-bundles

      - name: Create GitHub Release with extension zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension-bundles/*.zip
          generate_release_notes: true

  publish-chrome:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check Chrome Web Store credentials
        id: cws_check
        env:
          CWS_SA_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${CWS_SA_JSON:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CWS_SERVICE_ACCOUNT_JSON secret is not set; skipping Chrome Web Store upload."
          fi

      - name: Download extension artifacts
        if: steps.cws_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: extension-bundles

      - name: Authenticate to Google Cloud (Chrome Web Store API v2)
        if: steps.cws_check.outputs.enabled == 'true'
        id: cws_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Upload & Publish Chrome Extension (CWS API v2)
        if: steps.cws_check.outputs.enabled == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.cws_auth.outputs.access_token }}
          PUBLISHER_ID: 57852504-88f0-4970-9c9f-e4f794ed0815
          ITEM_ID: ennpigbnodfiobgblonmckfeonnagjeg
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls extension-bundles/*-chrome.zip | head -n 1)
          echo "Uploading ${ZIP_FILE} to Chrome Web Store..."

          UPLOAD_CODE=$(curl -sS -o /tmp/cws-upload.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ZIP_FILE}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${ITEM_ID}:upload")
          cat /tmp/cws-upload.json
          echo ""
          if [ "${UPLOAD_CODE}" -ge 400 ]; then
            echo "::error::Chrome Web Store upload failed (HTTP ${UPLOAD_CODE})"
            exit 1
          fi

          UPLOAD_STATE=$(jq -r '.uploadState // "IN_PROGRESS"' /tmp/cws-upload.json)
          if [ "${UPLOAD_STATE}" = "FAILED" ] || [ "${UPLOAD_STATE}" = "NOT_FOUND" ] || [ "${UPLOAD_STATE}" = "UPLOAD_STATE_UNSPECIFIED" ]; then
            echo "::error::Chrome Web Store upload failed with state: ${UPLOAD_STATE}"
            exit 1
          fi

          if [ "${UPLOAD_STATE}" != "SUCCEEDED" ]; then
            for i in $(seq 1 24); do
              sleep 5
              STATUS_CODE=$(curl -sS -o /tmp/cws-status.json -w "%{http_code}" \
                -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${ITEM_ID}:fetchStatus")
              cat /tmp/cws-status.json
              echo ""
              if [ "${STATUS_CODE}" -ge 400 ]; then
                echo "::error::Chrome Web Store fetchStatus failed (HTTP ${STATUS_CODE})"
                exit 1
              fi
              UPLOAD_STATE=$(jq -r '.lastAsyncUploadState // "IN_PROGRESS"' /tmp/cws-status.json)
              if [ "${UPLOAD_STATE}" = "SUCCEEDED" ]; then
                break
              fi
              if [ "${UPLOAD_STATE}" = "FAILED" ] || [ "${UPLOAD_STATE}" = "NOT_FOUND" ] || [ "${UPLOAD_STATE}" = "UPLOAD_STATE_UNSPECIFIED" ]; then
                echo "::error::Chrome Web Store async upload failed with state: ${UPLOAD_STATE}"
                exit 1
              fi
            done
          fi

          if [ "${UPLOAD_STATE}" != "SUCCEEDED" ]; then
            echo "::error::Timed out waiting for Chrome Web Store upload (last state: ${UPLOAD_STATE})"
            exit 1
          fi

          PUBLISH_CODE=$(curl -sS -o /tmp/cws-publish.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${ITEM_ID}:publish")
          cat /tmp/cws-publish.json
          echo ""
          if [ "${PUBLISH_CODE}" -ge 400 ]; then
            echo "::error::Chrome Web Store publish failed (HTTP ${PUBLISH_CODE})"
            exit 1
          fi

  publish-firefox:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check Firefox Add-ons (AMO) credentials
        id: amo_check
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "${AMO_JWT_ISSUER:-}" ] && [ -n "${AMO_JWT_SECRET:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AMO_JWT_ISSUER / AMO_JWT_SECRET not set; skipping Firefox Add-ons (AMO) publish."
          fi

      - name: Setup Node.js
        if: steps.amo_check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download extension artifacts
        if: steps.amo_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: extension-bundles

      - name: Submit Firefox Extension to AMO
        if: steps.amo_check.outputs.enabled == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          SOURCES_ZIP=$(ls extension-bundles/*-sources.zip | head -n 1)
          npx --yes web-ext@latest sign \
            --channel=listed \
            --approval-timeout=0 \
            --source-dir=extension-bundles/firefox-mv3 \
            --upload-source-code="${SOURCES_ZIP}" \
            --artifacts-dir=/tmp/amo-artifacts \
            --api-key="${AMO_JWT_ISSUER}" \
            --api-secret="${AMO_JWT_SECRET}"

  publish-edge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check Microsoft Edge Add-ons credentials
        id: edge_check
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          if [ -n "${EDGE_PRODUCT_ID:-}" ] && [ -n "${EDGE_CLIENT_ID:-}" ] && [ -n "${EDGE_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "EDGE_PRODUCT_ID / EDGE_CLIENT_ID / EDGE_API_KEY not set; skipping Edge Add-ons publish."
          fi

      - name: Download extension artifacts
        if: steps.edge_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-bundles
          path: extension-bundles

      - name: Upload & Publish Microsoft Edge Extension (Edge API v1.1)
        if: steps.edge_check.outputs.enabled == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          set -euo pipefail
          ZIP_FILE=$(ls extension-bundles/*-chrome.zip | head -n 1)
          echo "Uploading ${ZIP_FILE} to Microsoft Edge Add-ons..."

          UPLOAD_CODE=$(curl -sS -D /tmp/edge-upload-headers.txt -o /tmp/edge-upload.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${ZIP_FILE}" \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package")
          if [ "${UPLOAD_CODE}" -ge 400 ]; then
            cat /tmp/edge-upload.txt
            echo "::error::Edge Add-ons package upload failed (HTTP ${UPLOAD_CODE})"
            exit 1
          fi

          OPERATION_ID=$(grep -i '^location:' /tmp/edge-upload-headers.txt | tail -n 1 | awk '{print $2}' | tr -d '\r\n' || true)
          if [ -z "${OPERATION_ID}" ]; then
            echo "::error::Edge Add-ons upload response did not include a Location operation ID"
            exit 1
          fi

          OP_STATUS="InProgress"
          for i in $(seq 1 24); do
            sleep 5
            POLL_CODE=$(curl -sS -o /tmp/edge-upload-status.json -w "%{http_code}" \
              -H "Authorization: ApiKey ${EDGE_API_KEY}" \
              -H "X-ClientID: ${EDGE_CLIENT_ID}" \
              "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/draft/package/operations/${OPERATION_ID}")
            cat /tmp/edge-upload-status.json
            echo ""
            if [ "${POLL_CODE}" -ge 400 ]; then
              echo "::error::Edge Add-ons upload status check failed (HTTP ${POLL_CODE})"
              exit 1
            fi
            OP_STATUS=$(jq -r '.status // "InProgress"' /tmp/edge-upload-status.json)
            if [ "${OP_STATUS}" = "Succeeded" ]; then
              break
            fi
            if [ "${OP_STATUS}" = "Failed" ]; then
              echo "::error::Edge Add-ons package validation failed"
              exit 1
            fi
          done

          if [ "${OP_STATUS}" != "Succeeded" ]; then
            echo "::error::Timed out waiting for Edge Add-ons package upload (last status: ${OP_STATUS})"
            exit 1
          fi

          PUBLISH_CODE=$(curl -sS -D /tmp/edge-publish-headers.txt -o /tmp/edge-publish.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: ApiKey ${EDGE_API_KEY}" \
            -H "X-ClientID: ${EDGE_CLIENT_ID}" \
            -H "Content-Type: application/json" \
            -d '{"notes":"Automated release from GitHub Actions"}' \
            "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions")
          cat /tmp/edge-publish.txt
          echo ""
          if [ "${PUBLISH_CODE}" -ge 400 ]; then
            echo "::error::Edge Add-ons publish failed (HTTP ${PUBLISH_CODE})"
            exit 1
          fi

          PUBLISH_OP_ID=$(grep -i '^location:' /tmp/edge-publish-headers.txt | tail -n 1 | awk '{print $2}' | tr -d '\r\n' || true)
          if [ -n "${PUBLISH_OP_ID}" ]; then
            PUB_STATUS="InProgress"
            for i in $(seq 1 24); do
              sleep 5
              PUB_POLL_CODE=$(curl -sS -o /tmp/edge-pub-status.json -w "%{http_code}" \
                -H "Authorization: ApiKey ${EDGE_API_KEY}" \
                -H "X-ClientID: ${EDGE_CLIENT_ID}" \
                "https://api.addons.microsoftedge.microsoft.com/v1/products/${EDGE_PRODUCT_ID}/submissions/operations/${PUBLISH_OP_ID}")
              cat /tmp/edge-pub-status.json
              echo ""
              if [ "${PUB_POLL_CODE}" -ge 400 ]; then
                echo "::error::Edge Add-ons publish status check failed (HTTP ${PUB_POLL_CODE})"
                exit 1
              fi
              PUB_STATUS=$(jq -r '.status // "InProgress"' /tmp/edge-pub-status.json)
              if [ "${PUB_STATUS}" = "Succeeded" ]; then
                break
              fi
              if [ "${PUB_STATUS}" = "Failed" ]; then
                echo "::error::Edge Add-ons submission publish failed"
                exit 1
              fi
            done
            if [ "${PUB_STATUS}" != "Succeeded" ]; then
              echo "::error::Timed out waiting for Edge Add-ons publish (last status: ${PUB_STATUS})"
              exit 1
            fi
          fi
